<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omid Style</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: #f4f6f8; color: #333; }
        
        /* هدر */
        header { background: #fff; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: bold; color: #1e3c72; }
        .logo span { color: #ff6b6b; }
        .cart { background: #1e3c72; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 14px; }

        /* بنر */
        .hero { background: #1e3c72; color: white; text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 24px; margin-bottom: 10px; }
        
        /* محصولات */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .title { text-align: center; margin-bottom: 20px; color: #1e3c72; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        /* کارت محصول */
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 220px; object-fit: cover; background: #eee; display: block; }
        .card h3 { margin: 15px 0 10px; font-size: 16px; color: #333; }
        .card p { color: #ff6b6b; font-weight: bold; margin-bottom: 15px; font-size: 15px; }
        .card button { background: #1e3c72; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 85%; font-family: 'Vazirmatn'; font-size: 14px; }

        /* فوتر */
        footer { text-align: center; padding: 20px; background: #1e3c72; color: white; margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Omid <span>Style</span></div>
        <a href="#" class="cart">🛒 سبد خرید (0)</a>
    </header>

    <div class="hero">
        <h1>جدیدترین تیشرت‌های فصل</h1>
    </div>

    <div class="container">
        <h2 class="title">محصولات ما</h2>
        <div class="grid">
            
            {% for product in products %}
            <div class="card">
                <img src="{{ product.image_url }}" alt="{{ product.name }}">
                <h3>{{ product.name }}</h3>
                <p>{{ product.price }} تومان</p>
                <button>افزودن به سبد</button>
            </div>
            {% endfor %}

        </div>
    </div>

    <footer>
        <p>© ۲۰۲۶ Omid Style - تمامی حقوق محفوظ است.</p>
    </footer>

</body>
</html>
