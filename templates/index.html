<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omid Style</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',sans-serif}
body{background:#0a0f1d;color:#fff}
a{text-decoration:none;color:inherit}
header{background:rgba(10,15,29,.95);border-bottom:1px solid #1e293b;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:24px;font-weight:900;color:#3b82f6}
.cart-btn{background:#2563eb;color:#fff;padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
.menu{list-style:none;display:flex;gap:20px;padding:10px 20px;border-top:1px solid #1e293b;justify-content:center}
.menu a{color:#94a3b8;cursor:pointer;font-size:14px}
.hero{padding:40px 20px;text-align:center}
.hero h1{font-size:40px;margin-bottom:15px}
.hero span{color:#3b82f6}
.btn{display:inline-block;background:#2563eb;color:#fff;padding:12px 30px;border-radius:30px;font-weight:bold;margin:5px;cursor:pointer;border:none;font-family:'Vazirmatn'}
.btn-outline{background:transparent;border:1px solid #1e293b}
.products{max-width:1200px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#131a2b;border:1px solid #1e293b;border-radius:15px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover}
.card-info{padding:15px;text-align:right}
.card-info h3{margin-bottom:8px}
.price{color:#3b82f6;font-weight:bold;margin-bottom:15px}
.add-btn{width:100%;background:#2563eb;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-family:'Vazirmatn';font-weight:bold}
footer{text-align:center;padding:30px;color:#94a3b8;border-top:1px solid #1e293b;margin-top:50px}
@media(max-width:600px){.hero h1{font-size:28px}.menu{gap:15px}.menu a{font-size:12px}}
</style>
</head>
<body>
<header>
<div class="logo"><i class="fa-solid fa-gem"></i> Omid Style</div>
<a class="cart-btn" id="cart-btn">🛒 سبد خرید (0)</a>
</header>
<ul class="menu">
<li><a>خانه</a></li>
<li><a class="nav-link">محصولات</a></li>
<li><a class="nav-link">تیشرت‌ها</a></li>
<li><a class="nav-link">شلوار</a></li>
<li><a href="/about">درباره ما</a></li>
</ul>
<section class="hero">
<h1>Omid <span>Style</span></h1>
<p style="color:#94a3b8;margin-bottom:20px">سبک زندگی تو، انتخاب ماست</p>
<button class="btn" id="scroll-btn">مشاهده محصولات</button>
<a href="/about" class="btn btn-outline">درباره ما</a>
</section>
<section class="products" id="products">
{% for product in products %}
<div class="card">
<img src="{{ product.image_url }}" alt="{{ product.name }}">
<div class="card-info">
<h3>{{ product.name }}</h3>
<div class="price">{{ product.price }} تومان</div>
<button class="add-btn add-to-cart">افزودن به سبد خرید</button>
</div>
</div>
{% endfor %}
</section>
<footer><p>© ۲۰۲۶ Omid Style</p></footer>
<script>
let cart=0;
document.querySelectorAll('.add-to-cart').forEach(b=>b.addEventListener('click',function(){
cart++;document.getElementById('cart-btn').innerHTML=🛒 سبد خرید (${cart});
alert('محصول به سبد خرید اضافه شد!');}));
document.getElementById('cart-btn').addEventListener('click',function(e){
e.preventDefault();alert(cart===0?'سبد خرید شما خالی است.':شما ${cart} محصول در سبد خرید دارید.);});
document.getElementById('scroll-btn').addEventListener('click',function(){
document.getElementById('products').scrollIntoView({behavior:'smooth'});});
document.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',function(e){
e.preventDefault();document.getElementById('products').scrollIntoView({behavior:'smooth'});}));
</script>
</body>
</html>
