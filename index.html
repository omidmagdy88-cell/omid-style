<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omid Style | فروشگاه لباس</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Tahoma, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: white;
            text-align: center;
        }
        .box { padding: 40px; }
        h1 { font-size: 40px; margin-bottom: 20px; }
        p { font-size: 18px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="box">
        <h1>👕 Omid Style</h1>
        <p>به فروشگاه لباس ما خوش آمدید</p>
        <p style="margin-top: 15px; font-size: 14px;">سایت ما به زودی راه‌اندازی می‌شود...</p>
    </div>
</body>
</html>
